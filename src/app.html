<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f4f6fb" />
		%sveltekit.head%
	</head>
	<!--
	"tap" rather than the "hover" default: every speculative load is a full server render
	with its own database queries, and on serverless each concurrent one can wake a separate
	cold instance. Preloading on pointer-down still lands ahead of the navigation.
-->
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
